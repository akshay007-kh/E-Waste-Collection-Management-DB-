
<!DOCTYPE html>
<html>
<head>
    <title>Edit Feedback</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f9;
            padding: 30px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }
        h2 { color: #30205c; }
        label {
            display: block;
            margin-top: 18px;
        }
        select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea { min-height: 120px; }
        button, a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #5135a5;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Feedback #{{ feedback.id }}</h2>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <p><b>User:</b> {{ feedback.user.name }}</p>
    <p><b>Request ID:</b> {{ feedback.request.id }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>Rating</label>
        <select name="rating" required>
            <option value="1" {% if feedback.rating == 1 %}selected{% endif %}>1 - Poor</option>
            <option value="2" {% if feedback.rating == 2 %}selected{% endif %}>2 - Fair</option>
            <option value="3" {% if feedback.rating == 3 %}selected{% endif %}>3 - Good</option>
            <option value="4" {% if feedback.rating == 4 %}selected{% endif %}>4 - Very Good</option>
            <option value="5" {% if feedback.rating == 5 %}selected{% endif %}>5 - Excellent</option>
        </select>

        <label>Feedback Message</label>
        <textarea name="message" required>{{ feedback.message }}</textarea>

        <button type="submit">Update Feedback</button>
        <a href="{% url 'manage_feedback' %}">Cancel</a>
    </form>
</div>

</body>
</html>
