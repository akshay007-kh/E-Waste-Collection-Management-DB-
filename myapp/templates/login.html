
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | E-Waste</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b18;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            padding: 40px;
            background: #11162a;
            border: 1px solid #282e4a;
            border-radius: 20px;
        }

        h2 {
            text-align: center;
            color: #a78bfa;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #9299b5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            background: #0b1020;
            border: 1px solid #303653;
            border-radius: 10px;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: #a78bfa;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            color: #ff7777;
            margin-bottom: 15px;
            text-align: center;
        }

        a {
            color: #a78bfa;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Welcome Back</h2>
    <p>Login to your E-Waste account</p>

    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <form method="POST" action="{% url 'login' %}">
    {% csrf_token %}

    <input type="text" name="identifier"
           placeholder="Email" required>

    <input type="password" name="password"
           placeholder="Password" required>

    <button type="submit">Login</button>
</form>

    <p style="margin-top:20px; margin-bottom:0;">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>

    <p style="margin-top:12px; margin-bottom:0;">
        Staff?
        <a href="{% url 'staff_register' %}">Register as Staff</a>
    </p>

</div>

</body>
</html>
