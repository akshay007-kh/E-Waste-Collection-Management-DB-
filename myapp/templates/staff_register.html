
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration | E-Waste</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080b18;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #11162a;
            padding: 35px;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            border: 1px solid #303653;
            box-shadow: 0 20px 60px #00000040;
        }

        .logo {
            text-align: center;
            color: #a78bfa;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        h2 {
            color: #a78bfa;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9299b5;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #c5c9dc;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #0b1020;
            color: white;
            border: 1px solid #303653;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px #8b5cf620;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px #8b5cf640;
        }

        .messages {
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            color: #9299b5;
            font-size: 13px;
            margin-top: 20px;
        }

        a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">♻ E-WASTE</div>

    <h2>Staff Registration</h2>

    <p class="subtitle">
        Create your staff account
    </p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'staff_register' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Full Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter full name"
                   required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel"
                   name="phone"
                   placeholder="Enter phone number"
                   required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email"
                   name="email"
                   placeholder="Enter email address"
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Create password"
                   minlength="8"
                   required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address"
                      placeholder="Enter address"
                      required></textarea>
        </div>

        <button type="submit">
            Register Staff →
        </button>
    </form>

    <div class="login-link">
        Already registered?
        <a href="{% url 'login' %}">Login</a>
    </div>

</div>

</body>
</html>
