
<!DOCTYPE html>
<html>
<head>
    <title>Add Recycling</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f9;
            padding: 30px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }
        h2 { color: #30205c; }
        label {
            display: block;
            margin-top: 18px;
        }
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button, a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #5135a5;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Add Recycling Record</h2>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <label>Select Collection</label>
        <select name="collection" required>
            <option value="">-- Select Collection --</option>
            {% for item in collections %}
            <option value="{{ item.id }}">
                Collection #{{ item.id }} -
                {{ item.request.user.name }} -
                {{ item.request.category.category_name }} -
                {{ item.actual_weight }} kg
            </option>
            {% endfor %}
        </select>

        <label>Recycled Weight (kg)</label>
        <input type="number" name="recycled_weight"
               step="0.01" min="0.01" required>

        <label>Recycling Date</label>
        <input type="date" name="recycling_date"
               value="{{ today|date:'Y-m-d' }}" required>

        <label>Status</label>
        <select name="status" required>
            <option value="Processing">Processing</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">Save Recycling</button>
        <a href="{% url 'manage_recycling' %}">Cancel</a>
    </form>
</div>

</body>
</html>
